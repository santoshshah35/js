<!doctype html>
<html lang="ne">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Nepali Bikram Sambat calendar with tithi, festivals, news, rashifal, forex and gold rates, and a date converter.">
  <title>Patro</title>
  <meta name="theme-color" content="#c8102e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Patro">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">पा</span>
      <span class="brand-name">Patro</span>
    </div>
    <div class="today" aria-live="polite">
      <div class="today-bs" id="today-bs"></div>
      <div class="today-meta" id="today-meta"></div>
    </div>
    <div class="topbar-actions">
      <span class="clock" id="clock" title="Nepal Time (UTC+05:45)"></span>
      <button type="button" class="lang-toggle" id="lang-toggle" aria-label="Switch language"></button>
    </div>
  </header>

  <div class="alert-strip" id="alert-strip" role="alert" hidden></div>
  <button type="button" class="event-strip" id="event-strip" hidden></button>
  <div class="feed-slot feed-top" data-feed-slot="top" hidden></div>

  <main>
    <div class="layout" data-view="calendar">
      <section class="calendar" aria-labelledby="month-title">
        <div class="calendar-nav">
          <button type="button" class="icon-btn" id="prev-month" aria-label="Previous month">‹</button>
          <div class="month-heading">
            <h1 id="month-title"></h1>
            <p id="month-subtitle"></p>
          </div>
          <button type="button" class="icon-btn" id="next-month" aria-label="Next month">›</button>
        </div>
        <div class="calendar-controls">
          <label class="sr-only" for="year-select">Year</label>
          <select id="year-select"></select>
          <label class="sr-only" for="month-select">Month</label>
          <select id="month-select"></select>
          <button type="button" class="btn" id="go-today"></button>
        </div>
        <p class="estimate-note" id="estimate-note" hidden></p>
        <div class="grid" id="weekday-row"></div>
        <div class="grid days" id="days"></div>
      </section>

      <aside class="side">
        <section class="card day-detail" id="day-detail" aria-live="polite"></section>
        <section class="card notes-card" id="notes-card"></section>
        <section class="card home-news" id="home-news" hidden>
          <h2 id="home-news-title"></h2>
          <ul class="news-list" id="home-news-list"></ul>
          <button type="button" class="link-btn" id="home-news-all"></button>
        </section>
        <section class="card">
          <h2 id="events-title"></h2>
          <ul class="event-list" id="event-list"></ul>
        </section>
      </aside>
    </div>

    <div class="screen narrow" data-view="news" hidden>
      <div class="feed-slot" data-feed-slot="news" hidden></div>
      <section class="card" aria-labelledby="news-title">
        <div class="card-head">
          <h1 class="card-title" id="news-title"></h1>
          <div class="news-head-actions">
            <p class="muted" id="news-meta" aria-live="polite"></p>
            <button type="button" class="icon-btn news-refresh" id="news-refresh">⟳</button>
          </div>
        </div>
        <div class="segmented three" role="group" aria-label="Language">
          <button type="button" id="news-lang-all" aria-pressed="true"></button>
          <button type="button" id="news-lang-ne" aria-pressed="false" lang="ne"></button>
          <button type="button" id="news-lang-en" aria-pressed="false" lang="en"></button>
        </div>
        <div class="chips" id="news-cats" role="group" aria-label="Category"></div>
        <section class="news-trending" id="news-trending" hidden></section>
        <div class="news-tools">
          <select id="news-source" aria-label="Source"></select>
          <input type="search" id="news-search" autocomplete="off">
        </div>
        <ul class="news-list" id="news-list"></ul>
        <button type="button" class="btn news-more" id="news-more" hidden></button>
      </section>
    </div>

    <div class="screen" data-view="rashifal" hidden>
      <div class="feed-slot" data-feed-slot="rashifal" hidden></div>
      <section class="card" aria-labelledby="rashifal-title">
        <div class="screen-head">
          <button type="button" class="icon-btn" id="rashifal-prev">‹</button>
          <div class="screen-title">
            <h1 id="rashifal-title"></h1>
            <p id="rashifal-date"></p>
          </div>
          <button type="button" class="icon-btn" id="rashifal-next">›</button>
        </div>
        <div class="segmented three" role="tablist" aria-label="Rashifal period">
          <button type="button" role="tab" id="period-day" aria-selected="true"></button>
          <button type="button" role="tab" id="period-week" aria-selected="false"></button>
          <button type="button" role="tab" id="period-month" aria-selected="false"></button>
        </div>
        <p class="moon-line" id="rashifal-moon"></p>
        <ul class="rashi-grid" id="rashi-grid"></ul>
        <p class="fineprint" id="rashifal-note"></p>
      </section>
    </div>

    <div class="screen narrow" data-view="converter" hidden>
      <section class="card">
        <h1 class="card-title" id="converter-title"></h1>
        <div class="segmented" role="tablist">
          <button type="button" role="tab" id="tab-bs2ad" aria-selected="true"></button>
          <button type="button" role="tab" id="tab-ad2bs" aria-selected="false"></button>
        </div>
        <form class="converter" id="converter" novalidate>
          <div class="converter-fields">
            <input type="number" id="conv-year" inputmode="numeric" required>
            <select id="conv-month"></select>
            <input type="number" id="conv-day" inputmode="numeric" min="1" max="32" required>
          </div>
          <button type="submit" class="btn btn-primary" id="conv-submit"></button>
          <p class="converter-result" id="conv-result" role="status"></p>
          <button type="button" class="link-btn" id="conv-show" hidden></button>
        </form>
      </section>
      <section class="card">
        <h2 class="card-title" id="land-title"></h2>
        <div class="tool-fields">
          <input type="number" id="land-value" inputmode="decimal" min="0" step="any">
          <select id="land-unit"></select>
        </div>
        <ul class="tool-result" id="land-result" aria-live="polite"></ul>
      </section>
      <section class="card">
        <h2 class="card-title" id="words-title"></h2>
        <input type="text" id="words-value" inputmode="decimal" autocomplete="off">
        <ul class="tool-result" id="words-result" aria-live="polite"></ul>
      </section>
    </div>

    <div class="screen" data-view="forex" hidden>
      <div class="feed-slot" data-feed-slot="forex" hidden></div>
      <section class="card" aria-labelledby="forex-title">
        <div class="card-head">
          <h1 class="card-title" id="forex-title"></h1>
          <p class="muted" id="forex-meta"></p>
        </div>
        <div id="forex-body"></div>
      </section>

      <section class="card" aria-labelledby="calc-title">
        <h2 class="card-title" id="calc-title"></h2>
        <form class="calc" id="calc-form" novalidate>
          <div class="segmented">
            <button type="button" id="calc-to-npr" aria-pressed="true"></button>
            <button type="button" id="calc-from-npr" aria-pressed="false"></button>
          </div>
          <div class="calc-fields">
            <input type="number" id="calc-amount" inputmode="decimal" min="0" step="any">
            <select id="calc-currency"></select>
          </div>
          <p class="calc-result" id="calc-result" aria-live="polite"></p>
          <p class="fineprint" id="calc-basis"></p>
        </form>
      </section>

      <section class="card" aria-labelledby="gold-title">
        <div class="card-head">
          <h2 class="card-title" id="gold-title"></h2>
          <p class="muted" id="gold-meta"></p>
        </div>
        <div id="gold-body"></div>
      </section>
    </div>

    <div class="screen narrow" data-view="fuel" hidden>
      <div class="feed-slot" data-feed-slot="fuel" hidden></div>
      <section class="card" aria-labelledby="fuel-title">
        <div class="card-head">
          <h1 class="card-title" id="fuel-title"></h1>
          <p class="muted" id="fuel-meta"></p>
        </div>
        <div id="fuel-body"></div>
      </section>
    </div>

    <div class="screen narrow" data-view="events" hidden>
      <section class="card" aria-labelledby="upcoming-title">
        <h1 class="card-title" id="upcoming-title"></h1>
        <div id="upcoming-list"></div>
      </section>
    </div>

    <footer class="footer">
      <p id="footer-note"></p>
    </footer>
  </main>

  <nav class="bottom-nav" aria-label="Main">
    <button type="button" class="nav-item" id="nav-calendar" data-target="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span class="nav-label"></span>
    </button>
    <button type="button" class="nav-item" id="nav-news" data-target="news">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5.5h12v13a1.5 1.5 0 0 0 1.5 1.5H6a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M16.5 9h3v9.5a1.5 1.5 0 0 1-3 0M7.5 9h6M7.5 12.5h6M7.5 16h4"/></svg>
      <span class="nav-label"></span>
    </button>
    <button type="button" class="nav-item" id="nav-rashifal" data-target="rashifal">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A8 8 0 1 1 9.4 4.5a6.4 6.4 0 0 0 10.1 10.1z"/><path d="M17 3.5l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6z"/></svg>
      <span class="nav-label"></span>
    </button>
    <button type="button" class="nav-item" id="nav-converter" data-target="converter">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h15M15.5 4.5 19 8l-3.5 3.5M20 16H5M8.5 12.5 5 16l3.5 3.5"/></svg>
      <span class="nav-label"></span>
    </button>
    <button type="button" class="nav-item" id="nav-forex" data-target="forex">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></svg>
      <span class="nav-label"></span>
    </button>
    <button type="button" class="nav-item" id="nav-fuel" data-target="fuel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20.5V5a1.5 1.5 0 0 1 1.5-1.5h6A1.5 1.5 0 0 1 14 5v15.5M3.5 20.5h12M7.5 7.5h4v3.5h-4zM14 10h1.5a2 2 0 0 1 2 2v4.5a1.5 1.5 0 0 0 3 0V8.5L18 6"/></svg>
      <span class="nav-label"></span>
    </button>
    <button type="button" class="nav-item" id="nav-more" aria-haspopup="dialog" aria-expanded="false" aria-controls="more-sheet">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span class="nav-label"></span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="more-sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="more-title">
      <h2 id="more-title"></h2>
      <div class="setting" id="account-box"></div>
      <div class="setting">
        <p class="setting-label" id="theme-label"></p>
        <div class="segmented three" role="radiogroup" aria-labelledby="theme-label">
          <button type="button" role="radio" id="theme-system"></button>
          <button type="button" role="radio" id="theme-light"></button>
          <button type="button" role="radio" id="theme-dark"></button>
        </div>
      </div>
      <div class="setting">
        <p class="setting-label" id="lang-label"></p>
        <div class="segmented" role="radiogroup" aria-labelledby="lang-label">
          <button type="button" role="radio" id="lang-ne" lang="ne">नेपाली</button>
          <button type="button" role="radio" id="lang-en" lang="en">English</button>
        </div>
      </div>
      <div class="setting">
        <p class="setting-label" id="notify-label"></p>
        <div class="segmented" role="radiogroup" aria-labelledby="notify-label">
          <button type="button" role="radio" id="notify-on"></button>
          <button type="button" role="radio" id="notify-off"></button>
        </div>
        <p class="fineprint" id="notify-note"></p>
      </div>
      <p class="fineprint" id="about-text"></p>
      <button type="button" class="btn sheet-close" id="sheet-close"></button>
    </div>
  </div>

  <div class="sheet-backdrop" id="profile-sheet" hidden>
    <div class="sheet profile-sheet" role="dialog" aria-modal="true" aria-labelledby="profile-title">
      <h2 id="profile-title"></h2>
      <form class="profile-form" id="profile-form" novalidate></form>
    </div>
  </div>

  <div class="sheet-backdrop" id="login-sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="login-title">
      <h2 id="login-title"></h2>
      <p id="login-why"></p>
      <div class="login-buttons">
        <button type="button" class="btn login-btn login-google" id="login-google"></button>
        <button type="button" class="btn login-btn login-facebook" id="login-facebook"></button>
      </div>
      <p class="login-status" id="login-status" role="status"></p>
      <p class="fineprint" id="login-privacy"></p>
      <button type="button" class="btn sheet-close" id="login-close"></button>
    </div>
  </div>

  <script src="lib/bs-data.js"></script>
  <script src="lib/bs.js"></script>
  <script src="lib/tithi.js"></script>
  <script src="lib/events.js"></script>
  <script src="lib/lunar.js"></script>
  <script src="lib/upcoming.js"></script>
  <script src="lib/rashifal.js"></script>
  <script src="lib/rates.js"></script>
  <script src="lib/feed.js"></script>
  <script src="lib/config.js"></script>
  <script src="lib/custom-events.js"></script>
  <script src="lib/auth.js"></script>
  <script src="lib/news.js"></script>
  <script src="lib/trending.js"></script>
  <script src="lib/alerts.js"></script>
  <script src="lib/profile.js"></script>
  <script src="lib/tools.js"></script>
  <script src="ui/core.js"></script>
  <script src="ui/remote.js"></script>
  <script src="ui/account.js"></script>
  <script src="ui/profile.js"></script>
  <script src="ui/alerts.js"></script>
  <script src="ui/calendar.js"></script>
  <script src="ui/upcoming.js"></script>
  <script src="ui/rashifal.js"></script>
  <script src="ui/converter.js"></script>
  <script src="ui/tools.js"></script>
  <script src="ui/markets.js"></script>
  <script src="ui/feed.js"></script>
  <script src="ui/widget.js"></script>
  <script src="ui/notes.js"></script>
  <script src="ui/news.js"></script>
  <script src="ui/shell.js"></script>
</body>
</html>
